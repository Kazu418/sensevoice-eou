<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:18px}.h{fill:#4b35c8;font-weight:700}.t{font-size:19px}.small{font-size:15px}.tiny{font-size:13px}.bold{font-weight:700}.box{fill:#fff;stroke:#333;stroke-width:1.4}.soft{fill:#f7f7f7;stroke:#555;stroke-width:1.2}.blue{fill:#eef5ff}.green{fill:#eef8e8}.yellow{fill:#fff7dc}.pink{fill:#f8edf8}.red{fill:#fdeaea}.purple{fill:#f2edff}.dash{stroke:#4b35c8;stroke-width:1.7;stroke-dasharray:7 6;fill:none}.line{stroke:#111;stroke-width:1.7;fill:none}.muted{fill:#555}.center{text-anchor:middle;dominant-baseline:middle}
</style><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#111"/></marker><marker id="arrp" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#4b35c8"/></marker></defs><rect x="1" y="1" width="1670" height="939" rx="12" fill="#fff" stroke="#222"/><text x="836" y="43" class="h" style="font-size:34px" text-anchor="middle">SenseVoice-Small Architecture (measured from ONNX)</text><rect x="41" y="66" width="282" height="258" rx="10" class="soft"/><text x="57" y="94" class="h t" text-anchor="start">1) Input</text><text x="66" y="127" class="t" text-anchor="start"><tspan x="66" dy="0">Input x (N, T, 560)</tspan><tspan x="66" dy="23">80-dim fbank × LFR</tspan><tspan x="66" dy="23">(window 7, shift 6) = 560,</tspan><tspan x="66" dy="23">CMVN applied</tspan></text><text x="57" y="244" class="h t" text-anchor="start">+ language / text_norm</text><text x="66" y="277" class="t" text-anchor="start"><tspan x="66" dy="0">embedding weight [16, 560]</tspan><tspan x="66" dy="23">→ one of 16 prompt embeddings</tspan></text><path d="M343 138 L402 138" class="line" marker-end="url(#arr)"/><text x="423" y="99" class="h t" text-anchor="start">2) Insert 4 special frames before acoustic frames</text><text x="873" y="99" class="h small" text-anchor="start">(important)</text><rect x="425" y="117" width="64" height="42" rx="7" class="blue"/><text x="457" y="139" class="center t" text-anchor="middle">[LID]</text><rect x="496" y="117" width="64" height="42" rx="7" class="green"/><text x="528" y="139" class="center t" text-anchor="middle">[SER]</text><rect x="567" y="117" width="64" height="42" rx="7" class="yellow"/><text x="599" y="139" class="center t" text-anchor="middle">[AED]</text><rect x="638" y="117" width="64" height="42" rx="7" class="pink"/><text x="670" y="139" class="center t" text-anchor="middle">[ITN]</text><rect x="711" y="117" width="58" height="42" rx="7" class="soft"/><rect x="783" y="117" width="58" height="42" rx="7" class="soft"/><rect x="855" y="117" width="58" height="42" rx="7" class="soft"/><rect x="927" y="117" width="58" height="42" rx="7" class="soft"/><rect x="999" y="117" width="58" height="42" rx="7" class="soft"/><text x="1030" y="143" class="t" text-anchor="start">•••</text><path d="M435 169 L435 175 L690 175 L690 169" class="line"/><text x="562" y="195" class="t" text-anchor="middle">special frames (4)</text><path d="M713 169 L713 175 L1013 175 L1013 169" class="line"/><text x="863" y="195" class="t" text-anchor="middle">acoustic frames ...</text><path d="M730 177 L730 218" class="line" marker-end="url(#arr)"/><rect x="399" y="219" width="633" height="190" rx="10" class="soft"/><text x="413" y="246" class="h t" text-anchor="start">3) SenseVoice Encoder (total 50 SAN-M blocks)</text><text x="434" y="273" class="t" text-anchor="start"><tspan x="434" dy="0">• encoders0: 1 layer</tspan><tspan x="434" dy="21">• encoders: 49 layers</tspan><tspan x="434" dy="21">• total 50 SAN-M blocks</tspan><tspan x="434" dy="21">• Each block:</tspan><tspan x="434" dy="21">   self_attn (linear_q_k_v 512→1536) + FSMN (kernel 11)</tspan><tspan x="434" dy="21">              + feed_forward (512→2048→512)</tspan><tspan x="434" dy="21">• hidden size = 512</tspan></text><path d="M731 409 L731 426" class="line" marker-end="url(#arr)"/><rect x="398" y="426" width="632" height="34" rx="10" class="soft"/><text x="412" y="449" class="h t" text-anchor="start">4) tp_norm (final LayerNorm)</text><path d="M731 460 L731 474" class="line" marker-end="url(#arr)"/><rect x="398" y="474" width="632" height="34" rx="10" class="soft"/><text x="412" y="497" class="h t" text-anchor="start">5) Extract feature: /encoder/tp_norm/Add_1_output_0</text><text x="928" y="497" class="t" text-anchor="start">(N, T, 512)</text><path d="M489 508 L489 524" class="line" marker-end="url(#arr)"/><path d="M867 508 L867 524" class="line" marker-end="url(#arr)"/><rect x="360" y="524" width="260" height="30" rx="7" class="soft"/><text x="374" y="545" class="h t" text-anchor="start">6A) ctc_lo (512 → 25055)</text><rect x="360" y="562" width="260" height="30" rx="7" class="soft"/><text x="374" y="583" class="h t" text-anchor="start">7A) logits   (N, T, 25055)</text><rect x="360" y="600" width="260" height="30" rx="7" class="soft"/><text x="374" y="621" class="h t" text-anchor="start">8A) greedy decode</text><path d="M489 554 L489 562" class="line" marker-end="url(#arr)"/><path d="M489 592 L489 600" class="line" marker-end="url(#arr)"/><path d="M489 630 L489 644" class="line" marker-end="url(#arr)"/><rect x="360" y="644" width="260" height="42" rx="10" class="soft"/><text x="490" y="671" class="h" text-anchor="middle">Text</text><rect x="735" y="524" width="295" height="32" rx="7" class="soft"/><text x="749" y="546" class="h t" text-anchor="start">6B) turn head</text><rect x="735" y="562" width="295" height="32" rx="7" class="soft"/><text x="749" y="584" class="h t" text-anchor="start">7B) pool → 2048 → 1 → sigmoid</text><path d="M867 556 L867 562" class="line" marker-end="url(#arr)"/><path d="M867 594 L867 644" class="line" marker-end="url(#arr)"/><rect x="735" y="644" width="295" height="42" rx="10" class="soft"/><text x="882" y="671" class="h" text-anchor="middle">probability p (0–1)</text><rect x="1104" y="67" width="497" height="72" rx="8" class="dash"/><text x="1118" y="112" class="h" style="font-size:34px" text-anchor="start">★</text><text x="1160" y="98" class="t" text-anchor="start">Total params: 234M (int8 ≈ 228MB / fp32 ≈ 895MB).</text><text x="1160" y="123" class="t" text-anchor="start">Turn head: 2048×1 + bias ≈ 9 KB.</text><rect x="1095" y="161" width="515" height="476" rx="10" class="box"/><text x="1112" y="194" class="h t" text-anchor="start">7B) 2048-dim pooling (internals)</text><rect x="1112" y="214" width="173" height="64" rx="7" class="blue"/><text x="1128" y="239" class="t" text-anchor="start"><tspan x="1128" dy="0">(1) mean of first</tspan><tspan x="1128" dy="22">4 special frames</tspan></text><path d="M1296 245 L1335 245" class="line" marker-end="url(#arr)"/><rect x="1346" y="227" width="45" height="37" rx="6" class="blue"/><text x="1368" y="248" class="center t" text-anchor="middle">512</text><path d="M1400 245 L1437 245" class="line" marker-end="url(#arr)"/><text x="1448" y="231" class="t" text-anchor="start"><tspan x="1448" dy="0">LID / SER / AED /</tspan><tspan x="1448" dy="21">prompt-like</tspan><tspan x="1448" dy="21">information</tspan></text><rect x="1112" y="292" width="173" height="64" rx="7" class="green"/><text x="1128" y="317" class="t" text-anchor="start"><tspan x="1128" dy="0">(2) mean of all</tspan><tspan x="1128" dy="22">speech frames</tspan></text><path d="M1296 323 L1335 323" class="line" marker-end="url(#arr)"/><rect x="1346" y="305" width="45" height="37" rx="6" class="green"/><text x="1368" y="326" class="center t" text-anchor="middle">512</text><path d="M1400 323 L1437 323" class="line" marker-end="url(#arr)"/><text x="1448" y="309" class="t" text-anchor="start"><tspan x="1448" dy="0">whole-utterance</tspan><tspan x="1448" dy="21">meaning</tspan></text><rect x="1112" y="370" width="173" height="64" rx="7" class="yellow"/><text x="1128" y="395" class="t" text-anchor="start"><tspan x="1128" dy="0">(3) mean of last</tspan><tspan x="1128" dy="22">8 frames (~0.5 s)</tspan></text><path d="M1296 401 L1335 401" class="line" marker-end="url(#arr)"/><rect x="1346" y="383" width="45" height="37" rx="6" class="yellow"/><text x="1368" y="404" class="center t" text-anchor="middle">512</text><path d="M1400 401 L1437 401" class="line" marker-end="url(#arr)"/><text x="1448" y="387" class="t" text-anchor="start"><tspan x="1448" dy="0">useful for final</tspan><tspan x="1448" dy="21">intonation contour</tspan></text><rect x="1112" y="448" width="173" height="40" rx="7" class="pink"/><text x="1128" y="473" class="t" text-anchor="start"><tspan x="1128" dy="0">(4) last frame</tspan></text><path d="M1296 479 L1335 479" class="line" marker-end="url(#arr)"/><rect x="1346" y="461" width="45" height="37" rx="6" class="pink"/><text x="1368" y="482" class="center t" text-anchor="middle">512</text><path d="M1400 479 L1437 479" class="line" marker-end="url(#arr)"/><text x="1448" y="465" class="t" text-anchor="start"><tspan x="1448" dy="0">utterance end</tspan></text><path d="M1178 493 L1178 503 L1552 503 L1552 493" class="line"/><rect x="1247" y="523" width="162" height="38" rx="7" class="purple"/><text x="1328" y="546" class="center t" text-anchor="middle">concat = 2048</text><text x="1113" y="605" class="t" text-anchor="start">☼</text><text x="1163" y="594" class="t" text-anchor="start"><tspan x="1163" dy="0">After LFR, 1 frame = 60 ms (10 ms × shift 6),</tspan><tspan x="1163" dy="22">so last 8 frames ≈ 0.5 s.</tspan></text><path d="M1030 578 L1068 578 L1068 346 L1094 346" class="dash" marker-end="url(#arrp)"/><path d="M18 696 L1630 696" class="dash"/><text x="836" y="727" class="h" style="font-size:24px" text-anchor="middle">Runtime Flow</text><rect x="36" y="750" width="85" height="76" rx="10" class="soft"/><text x="78.5" y="779" class="bold" text-anchor="middle"><tspan x="78.5" dy="0">Mic</tspan></text><rect x="164" y="750" width="101" height="76" rx="10" class="soft"/><text x="214.5" y="779" class="bold" text-anchor="middle"><tspan x="214.5" dy="0">32 ms</tspan><tspan x="214.5" dy="20">frames</tspan></text><rect x="307" y="750" width="82" height="76" rx="10" class="soft"/><text x="348.0" y="779" class="bold" text-anchor="middle"><tspan x="348.0" dy="0">silero</tspan><tspan x="348.0" dy="20">VAD</tspan></text><rect x="425" y="750" width="175" height="76" rx="10" class="green"/><text x="512.5" y="779" class="bold" text-anchor="middle"><tspan x="512.5" dy="0">speech detected</tspan><tspan x="512.5" dy="20">(speech_ms ≥ 500 ms)</tspan></text><rect x="641" y="750" width="157" height="76" rx="10" class="yellow"/><text x="719.5" y="779" class="bold" text-anchor="middle"><tspan x="719.5" dy="0">400 ms</tspan><tspan x="719.5" dy="20">silence = pause</tspan></text><rect x="836" y="750" width="144" height="76" rx="10" class="purple"/><text x="908.0" y="779" class="bold" text-anchor="middle"><tspan x="908.0" dy="0">run SenseVoice</tspan><tspan x="908.0" dy="20">encoder once</tspan></text><rect x="1015" y="746" width="136" height="83" rx="10" class="soft"/><text x="1083.0" y="775" class="bold" text-anchor="middle"><tspan x="1083.0" dy="0">outputs</tspan><tspan x="1083.0" dy="20">• text</tspan><tspan x="1083.0" dy="20">• probability p</tspan></text><path d="M121 786 L164 786" class="line" marker-end="url(#arr)"/><path d="M265 786 L307 786" class="line" marker-end="url(#arr)"/><path d="M389 786 L425 786" class="line" marker-end="url(#arr)"/><path d="M600 786 L641 786" class="line" marker-end="url(#arr)"/><path d="M798 786 L836 786" class="line" marker-end="url(#arr)"/><path d="M980 786 L1015 786" class="line" marker-end="url(#arr)"/><path d="M1151 786 L1190 786" class="line" marker-end="url(#arr)"/><polygon points="1282,723 1343,752 1282,781 1221,752" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="1282" y="758" class="h" text-anchor="middle">p ≥ 0.70?</text><path d="M1343 752 L1383 752" class="line" marker-end="url(#arr)"/><text x="1351" y="735" class="bold green" text-anchor="start">YES</text><rect x="1385" y="712" width="133" height="80" rx="10" class="green"/><text x="1451" y="739" class="bold" text-anchor="middle">Confirm</text><text x="1451" y="763" class="small" text-anchor="middle"><tspan x="1451" dy="0">use the current</tspan><tspan x="1451" dy="18">text as-is</tspan></text><path d="M1282 781 L1282 816" class="line" marker-end="url(#arr)"/><text x="1300" y="806" class="bold" style="fill:#d22" text-anchor="start">NO</text><rect x="1181" y="816" width="203" height="95" rx="10" class="red"/><text x="1282" y="849" class="bold" text-anchor="middle">Keep listening</text><text x="1282" y="873" class="small" text-anchor="middle"><tspan x="1282" dy="0">judge again at</tspan><tspan x="1282" dy="18">the next pause</tspan></text><rect x="1474" y="815" width="163" height="99" rx="10" class="soft"/><text x="1555" y="842" class="bold" text-anchor="middle">Safety valve:</text><text x="1555" y="865" class="small" text-anchor="middle"><tspan x="1555" dy="0">if silence continues</tspan><tspan x="1555" dy="18">for 5 s,</tspan><tspan x="1555" dy="18">force confirm</tspan></text><path d="M1518 752 L1566 752 L1566 815" class="dash" marker-end="url(#arr)"/><path d="M1181 871 L347 871 L347 826" class="line" marker-end="url(#arr)"/></svg>